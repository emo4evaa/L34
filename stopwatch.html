<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ec2fd6, #71ceb7);
            color: #d2d80b;
         
        }
        h1 {
            color: #f5f4f3;   
        }
        h2 {
            color: #811f83;
        }
        button {
            background-color: #a90d8f;
            color: white;   
            padding: 2px 5px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        </style>
    </head>
    <body>
    <div class="wrapper">
    <h1>Stopwatch</h1>
    <p><span id="seconds">00</span>:<span id="milliseconds">00</span></p>
    <button id="button-start">Start</button>
    <button id="button-stop">Stop</button>
    <button id="button-reset">Reset</button>
</div>
<script src="stopwatch.js"></script>
    </body>
</html>
